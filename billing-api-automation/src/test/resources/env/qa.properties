# Billing API — QA (no secrets in repo). Override org/location and OAuth password via qa.local.properties or env.
# Run: ./gradlew test -Denv=qa -Dgroups=Smoke
#
billing.base.url=https://api-qa.commerce.abc.fitness/api/billing
billing.auth.url=https://api-qa.commerce.abc.fitness/api/authorization/token

# ABCFS-ORGANIZATION-ID (tenant) — required for all Billing API calls
billing.organization.id=REPLACE_ORGANIZATION_UUID

# Optional: ABCFS-LOCATION-ID for transaction endpoints and some GETs
billing.location.id=

# Commerce OAuth client credentials (Basic auth). Prefer env BILLING_OAUTH_PASSWORD or local file.
billing.oauth.username=ANYTIME_FITNESS
billing.oauth.password=

# Optional static JWT bypasses OAuth when set (CI secret)
auth.bearer.token=__FETCH_FROM_EXTERNAL__

# Optional merge file (same keys as this file)
external.api.env.path=

# Deep E2E: set when you have real IDs in QA
test.billing.account.id=
test.subscription.id=
test.external.id=
