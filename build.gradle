plugins {
    id 'java'
    id 'io.qameta.allure' version '2.11.2'
}

group = 'com.externalAPIs'
version = '1.0'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories { mavenCentral() }

ext {
    allureVersion = '2.27.0'
    restAssuredVersion = '5.4.0'
    testngVersion = '7.10.2'
}

dependencies {
    implementation "io.rest-assured:rest-assured:${restAssuredVersion}"
    implementation "io.rest-assured:json-path:${restAssuredVersion}"
    implementation "io.qameta.allure:allure-testng:${allureVersion}"
    implementation "io.qameta.allure:allure-rest-assured:${allureVersion}"
    implementation "org.testng:testng:${testngVersion}"
    implementation 'com.googlecode.json-simple:json-simple:1.1.1'
    implementation 'com.google.code.gson:gson:2.11.0'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.0'
    implementation 'org.slf4j:slf4j-simple:2.0.12'
    implementation 'org.apache.logging.log4j:log4j-core:2.22.1'
    implementation 'org.apache.logging.log4j:log4j-api:2.22.1'
}

/////////////////////////////////////////////////////////////
// ✅ SAFARI-SAFE OFFLINE ALLURE REPORT
/////////////////////////////////////////////////////////////
tasks.register('generateAllureReport') {
    group = "reporting"
    description = "Generate offline Allure report with embedded JSON (Safari-safe)"

    doLast {
        def resultsDir = new File("${project.projectDir}/build/allure-results")
        def outputDir  = new File("${project.projectDir}/reports/current")
        def timestamp  = new Date().format("yyyy-MM-dd_HHmmss_SSS")
        def isCI       = System.getenv("GITHUB_ACTIONS") != null

        println "\n🧹 Cleaning old Allure reports..."
        if (outputDir.exists()) outputDir.deleteDir()

        println "⚙️ Generating Allure report..."
        def cmd = "allure generate '${resultsDir}' --clean -o '${outputDir}'"
        def process = ["bash", "-c", cmd].execute()
        process.waitFor()

        if (process.exitValue() != 0) {
            println "❌ Allure CLI exited with code ${process.exitValue()}"
            return
        }
        println "✅ Allure report generated → ${outputDir}/index.html"

        // 🧩 Base64-embed JSON (UTF-8 safe)
        try {
            def dataDir  = new File("${outputDir}/data")
            def indexFile = new File("${outputDir}/index.html")
            if (!indexFile.exists() || !dataDir.exists()) {
                println "⚠️ Missing index.html or data folder, skipping embedding."
                return
            }

            println "🧩 Embedding JSON files into HTML (UTF-8 safe)..."
            def dataFiles = fileTree(dir: dataDir, include: '**/*.json').files
            def jsonMap = [:]
            dataFiles.each { f ->
                def encoded = f.getText('UTF-8').bytes.encodeBase64().toString()
                jsonMap[f.name] = encoded
            }

            def jsonContent = new groovy.json.JsonBuilder(jsonMap).toPrettyString()
            def finalHtml = new File("${outputDir}/Allure_Offline_Single_Safe.html")
            def indexHtml = indexFile.getText('UTF-8')

            def embeddedData = """
<script id='embedded-json' type='application/json'>
${jsonContent}
</script>
<script>
(function(){
  const el = document.getElementById('embedded-json');
  if(!el){console.error('❌ Embedded JSON not found');return;}
  const data = JSON.parse(el.textContent);
  const origFetch = window.fetch;
  window.fetch = (url)=>{
    if(url && url.includes('/data/')){
      const file=url.split('/').pop();
      const b64=data[file];
      if(b64){
        const decoded = decodeURIComponent(escape(atob(b64)));
        return Promise.resolve({
          ok:true,status:200,
          json:async()=>JSON.parse(decoded),
          text:async()=>decoded
        });
      }
    }
    return origFetch(url);
  };
  if('serviceWorker' in navigator){
    navigator.serviceWorker.getRegistrations().then(r=>r.forEach(s=>s.unregister()));
  }
  console.log('✅ Allure Offline Mode Activated');
})();
</script>
"""
            def mergedHtml = indexHtml.replaceFirst('(?i)</body>', "${embeddedData}\n</body>")
            finalHtml.setText(mergedHtml, 'UTF-8')
            println "✅ Created Safari-safe report → ${finalHtml.absolutePath}"
        } catch (Exception e) {
            println "⚠️ Embedding failed: ${e.message}"
        }

        copy {
            from outputDir
            into "${project.projectDir}/reports/history/${timestamp}"
        }
        println "🗂 Archived → reports/history/${timestamp}"

        if (!isCI && System.getProperty("os.name").toLowerCase().contains("mac")) {
            try {
                ["bash", "-c", "open '${outputDir}/Allure_Offline_Single_Safe.html'"].execute()
            } catch (ignored) {}
        }
    }
}

/////////////////////////////////////////////////////////////
// ✅ TEST CONFIGURATION
/////////////////////////////////////////////////////////////
test {
    useTestNG { suites 'testng.xml' }
    failFast = false
    ignoreFailures = true
    outputs.upToDateWhen { false }

    testLogging {
        events "passed", "failed", "skipped"
        exceptionFormat = 'full'
        showStandardStreams = true
    }

    doFirst {
        def resultsDir = new File("${project.projectDir}/build/allure-results")
        if (resultsDir.exists()) resultsDir.deleteDir()
        resultsDir.mkdirs()
        println "🧹 Cleared old allure-results"
    }

    finalizedBy 'generateAllureReport'
}

/////////////////////////////////////////////////////////////
// ✅ ALLURE ADAPTER CONFIG
/////////////////////////////////////////////////////////////
allure {
    version = allureVersion
    adapter {
        frameworks {
            testng { adapterVersion = allureVersion }
        }
        autoconfigure = true
        aspectjWeaver = true
    }
}

tasks.register('printEnv') {
    doLast {
        println "\n===== ENVIRONMENT INFO ====="
        println "Environment: " + System.getProperty("env", "dev")
        println "Java Version: " + JavaVersion.current()
        println "Allure Version: ${allureVersion}"
        println "RestAssured Version: ${restAssuredVersion}"
        println "============================\n"
    }
}
