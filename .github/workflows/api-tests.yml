# 🚀 Smart API Automation CI Workflow (Local + GitHub Ready)
name: 🚀 API Automation CI

on:
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      branch:
        description: "Select branch to run tests"
        required: true
        default: "feature/github-actions-poc-"
      test_group:
        description: "Test group (Sanity, Integration, Regression, All)"
        required: true
        default: "All"
      test_class:
        description: "Optional: Run only specific API test class"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  api-tests:
    runs-on: self-hosted
    env:
      ALLURE_RESULTS_DIR: build/allure-results
      ALLURE_REPORT_DIR: reports/current
      TZ: "Asia/Kolkata"

    steps:
      # -----------------------------------------
      # 1️⃣ Checkout Repository
      # -----------------------------------------
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref_name || 'feature/github-actions-poc-' }}
          token: ${{ secrets.GITHUB_TOKEN }}

      # -----------------------------------------
      # 2️⃣ Setup JDK
      # -----------------------------------------
      - name: ☕ Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: gradle   # ✅ Lightweight Gradle cache

      # -----------------------------------------
      # 3️⃣ Quick Gradle Cache Cleanup
      # -----------------------------------------
      - name: 🧹 Clean Gradle Temp Files
        run: |
          echo "🧹 Cleaning temporary Gradle files..."
          rm -rf ~/.gradle/caches/build-cache-* || true
          rm -rf ~/.gradle/daemon/* || true
          echo "✅ Cleanup done."

      # -----------------------------------------
      # 4️⃣ Smart Test Selection
      # -----------------------------------------
      - name: 🧠 Smart Test Selection
        id: smart
        run: |
          echo "Detecting changed test files..."
          CHANGED=$(git diff --name-only origin/main...HEAD | grep 'src/test/java' || true)
          if [ -n "$CHANGED" ]; then
            echo "group=Custom" >> $GITHUB_OUTPUT
          else
            echo "group=${{ github.event.inputs.test_group }}" >> $GITHUB_OUTPUT
          fi

      # -----------------------------------------
      # 5️⃣ Run API Tests
      # -----------------------------------------
      - name: 🧪 Run API Tests
        run: |
          echo "Running tests for: ${{ github.event.inputs.test_class || 'All tests' }}"
          if [ "${{ github.event.inputs.test_class }}" != "" ]; then
            ./gradlew --no-daemon clean test --tests "${{ github.event.inputs.test_class }}" --info
          elif [ "${{ github.event.inputs.test_group }}" != "" ] && [ "${{ github.event.inputs.test_group }}" != "All" ]; then
            ./gradlew --no-daemon clean test -Dgroups="${{ github.event.inputs.test_group }}" --info
          else
            ./gradlew --no-daemon clean test --info
          fi

      # -----------------------------------------
      # 6️⃣ Generate Allure Offline Report
      # -----------------------------------------
      - name: 📊 Generate Offline Allure Report
        if: always()
        run: |
          echo "⚙️ Generating offline Allure report..."
          ./gradlew --no-daemon generateAllureReport
          echo "✅ Report generated → reports/current/index.html"

      # -----------------------------------------
      # 7️⃣ Zip the Allure HTML (with versioning)
      # -----------------------------------------
      - name: 🗜️ Zip Allure HTML Report
        if: always()
        run: |
          DATE_TAG=$(date +'%Y-%m-%d_%H-%M')
          VERSIONED_NAME="Allure-Offline-Report_${DATE_TAG}_${{ github.run_number }}.zip"
          cd reports/current
          zip -r "../../${VERSIONED_NAME}" .
          cd ../..
          echo "✅ Created zip: ${VERSIONED_NAME}"
          echo "ZIP_NAME=${VERSIONED_NAME}" >> $GITHUB_ENV

      # -----------------------------------------
      # 8️⃣ Upload as GitHub Artifact
      # -----------------------------------------
      - name: 📦 Upload Offline Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_NAME }}
          retention-days: 15

      # -----------------------------------------
      # 9️⃣ (Optional) Slack / Email Notification
      # -----------------------------------------
      # - name: 📩 Notify via Email (Optional)
      #   if: failure()
      #   uses: dawidd6/action-send-mail@v3
      #   with:
      #     server_address: smtp.gmail.com
      #     server_port: 465
      #     username: ${{ secrets.EMAIL_USER }}
      #     password: ${{ secrets.EMAIL_PASS }}
      #     subject: "❌ API Test Failure - Run #${{ github.run_number }}"
      #     to: "qa-team@yourdomain.com"
      #     from: "GitHub Actions QA Bot"
      #     body: |
      #       Hi Team,
      #       The latest API test run failed. Please check the attached Allure report.
      #       Download: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

      # -----------------------------------------
      # 🔟 Fail Build on Test Failure
      # -----------------------------------------
      - name: 🛑 Fail Build on Test Failure
        if: failure()
        run: |
          echo "❌ Tests failed! Marking build as failed."
          exit 1
