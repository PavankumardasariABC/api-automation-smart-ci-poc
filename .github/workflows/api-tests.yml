name: 🚀 API Automation CI

on:
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      branch:
        description: "Select branch to run tests"
        required: true
        default: "feature/github-actions-poc-"
      test_group:
        description: "Test group (Sanity, Integration, Regression, All)"
        required: true
        default: "All"
      test_class:
        description: "Optional: Run only specific API test class"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  api-tests:
    runs-on: self-hosted
    env:
      TZ: "Asia/Kolkata"
      ALLURE_RESULTS_DIR: build/allure-results
      ALLURE_REPORT_DIR: reports/current
      AUTH_USERNAME: ${{ secrets.AUTH_USERNAME }}
      AUTH_PASSWORD: ${{ secrets.AUTH_PASSWORD }}

    steps:
      # -----------------------------------------
      # 1️⃣ Checkout Repository
      # -----------------------------------------
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      # -----------------------------------------
      # 2️⃣ Cache Gradle Wrapper & Dependencies
      # -----------------------------------------
      - name: ⚡ Cache Gradle Wrapper
        uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-wrapper-${{ hashFiles('**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-wrapper-

      - name: ⚡ Cache Gradle Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-caches-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-caches-

      # -----------------------------------------
      # 3️⃣ Setup JDK
      # -----------------------------------------
      - name: ☕ Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # -----------------------------------------
      # 4️⃣ Cache & Install Allure CLI
      # -----------------------------------------
      - name: ⚡ Cache Allure CLI
        uses: actions/cache@v4
        with:
          path: allure-cli
          key: ${{ runner.os }}-allure-2.27.0

      - name: 🧩 Install Allure CLI (cached)
        run: |
          BASE_DIR="${{ github.workspace }}/allure-cli"
          if [ ! -d "$BASE_DIR/allure-2.27.0" ]; then
            echo "⬇️ Installing Allure CLI..."
            mkdir -p "$BASE_DIR"
            curl -L -o "$BASE_DIR/allure.zip" https://github.com/allure-framework/allure2/releases/download/2.27.0/allure-2.27.0.zip
            unzip -q "$BASE_DIR/allure.zip" -d "$BASE_DIR"
            chmod +x "$BASE_DIR/allure-2.27.0/bin/allure"
          else
            echo "✅ Allure CLI already cached"
          fi
          echo "$BASE_DIR/allure-2.27.0/bin" >> $GITHUB_PATH
          allure --version

      # -----------------------------------------
      # 5️⃣ Smart Test Selection
      # -----------------------------------------
      - name: 🧠 Smart Test Selection
        id: smart
        run: |
          echo "Detecting changed test files..."
          CHANGED=$(git diff --name-only origin/feature/github-actions-poc-...HEAD | grep 'src/test/java' || true)
          if [ -n "$CHANGED" ]; then
            echo "Changed test files:"
            echo "$CHANGED"
            echo "group=Custom" >> $GITHUB_OUTPUT
          else
            echo "No specific changes; running default group."
            echo "group=${{ github.event.inputs.test_group }}" >> $GITHUB_OUTPUT
          fi

      # -----------------------------------------
      # 6️⃣ Run Tests (parallel & fast)
      # -----------------------------------------
      - name: 🧪 Run Tests
        run: |
          echo "🧪 Starting Test Execution..."
          if [ "${{ github.event.inputs.test_class }}" != "" ]; then
            echo "🎯 Running specific test class: ${{ github.event.inputs.test_class }}"
            ./gradlew test --parallel --max-workers=4 --tests "${{ github.event.inputs.test_class }}" --info
          elif [ "${{ github.event.inputs.test_group }}" != "" ] && [ "${{ github.event.inputs.test_group }}" != "All" ]; then
            echo "🏷️ Running specific TestNG group: ${{ github.event.inputs.test_group }}"
            ./gradlew test --parallel --max-workers=4 -Dgroups=${{ github.event.inputs.test_group }} --info
          else
            echo "🧩 Running full regression suite..."
            ./gradlew test --parallel --max-workers=4 --info
          fi

      # -----------------------------------------
      # 7️⃣ Generate Allure Report
      # -----------------------------------------
      - name: 📊 Generate Allure Report
        if: always()
        run: |
          if [ -d "build/allure-results" ] && [ "$(find build/allure-results -name '*.json' | wc -l)" -gt 0 ]; then
            ./gradlew generateAllureReport --info
          else
            echo "⚠️ No allure-results found — skipping report generation."
          fi

      # -----------------------------------------
      # 7.1️⃣ Embed Allure Report into Single HTML (Base64 Safe)
      # -----------------------------------------
      - name: 🧩 Embed Allure Report as Single HTML
        if: always()
        run: |
          REPORT_DIR="reports/current"
          OUTPUT_FILE="${REPORT_DIR}/Allure_Offline_Single_Safe.html"

          echo "📦 Embedding Allure JSON data into single HTML file..."
          mkdir -p "$REPORT_DIR"

          # Collect & compress all Allure JSON files
          TEMP_FILE="$REPORT_DIR/allure_data.json"
          find "$REPORT_DIR" -name '*.json' -exec cat {} + > "$TEMP_FILE"

          # Encode into Base64 to avoid CI shell truncation
          BASE64_JSON=$(base64 -i "$TEMP_FILE" | tr -d '\n')

          # Create embedded HTML that decodes Base64 back into JS at runtime
          cat <<EOF > "$OUTPUT_FILE"
  <!DOCTYPE html>
  <html>
  <head>
  <meta charset="UTF-8">
  <title>Allure Offline Report</title>
  <script>
  const decoded = atob("$BASE64_JSON");
  window.allureData = JSON.parse(decoded);
  </script>
  </head>
  <body>
  <iframe src="index.html" style="width:100%;height:100%;border:none;"></iframe>
  </body>
  </html>
  EOF
  
  echo "✅ Created Safari-safe offline report at $OUTPUT_FILE"
  ls -lh "$OUTPUT_FILE"

# -----------------------------------------
# 8️⃣ Verify Allure Results
# -----------------------------------------
- name: 🕵️ Verify Allure Results
  if: always()
  run: |
    if [ -d "build/allure-results" ]; then
      echo "✅ Found allure-results:"
      find build/allure-results -name "*.json" | wc -l
    else
      echo "❌ No allure-results found!"
    fi

# -----------------------------------------
# 9️⃣ Upload Artifacts (HTML + Full Folder)
# -----------------------------------------
- name: 📦 Upload Safari-Safe Offline HTML Report
  if: always()
  uses: actions/upload-artifact@v4
  with:
    name: Allure-Offline-Report-${{ github.run_number }}
    path: reports/current/Allure_Offline_Single_Safe.html
    retention-days: 15

- name: 📦 Upload Full Allure Report Folder
  if: always()
  uses: actions/upload-artifact@v4
  with:
    name: Allure-Full-Report-${{ github.run_number }}
    path: reports/current/
    retention-days: 15

# -----------------------------------------
# 🔟 Comment on PR with Report Link
# -----------------------------------------
- name: 💬 Comment on PR with Report Link
  if: ${{ github.event_name == 'pull_request' }}
  uses: actions/github-script@v7
  with:
    github-token: ${{ secrets.GITHUB_TOKEN }}
    script: |
      const prNumber = context.issue.number;
      const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
      const message = `
      ✅ **API Tests Executed Successfully**
      • **Branch:** \`${{ github.ref_name }}\`
      • **Suite:** \`${{ github.event.inputs.test_group || 'All' }}\`
      • 💾 **Download Report(s):**
        → [Offline HTML (1-Click)](${runUrl}) — *Allure-Offline-Report-${{ github.run_number }}*  
        → [Full Folder (Zip)](${runUrl}) — *Allure-Full-Report-${{ github.run_number }}*
      • Open locally for a full visual dashboard.`;
      await github.rest.issues.createComment({
        issue_number: prNumber,
        owner: context.repo.owner,
        repo: context.repo.repo,
        body: message
      });

# -----------------------------------------
# 11️⃣ Fail Build on Test Failure
# -----------------------------------------
- name: 🛑 Fail Build on Test Failure
  if: failure()
  run: exit 1
