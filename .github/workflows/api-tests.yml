# 🚀 Smart API Automation CI Workflow (Safari-safe + Single HTML Report)
name: 🚀 API Automation CI

on:
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      branch:
        description: "Select branch to run tests"
        required: true
        default: "feature/github-actions-poc-"
      test_group:
        description: "Test group (Sanity, Integration, Regression, All)"
        required: true
        default: "All"
      test_class:
        description: "Optional: Run only specific API test class (e.g., com.externalAPIs.tests.auth.Authorization_TokenTests)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  api-tests:
    runs-on: self-hosted
    env:
      ALLURE_RESULTS_DIR: build/allure-results
      ALLURE_REPORT_DIR: reports/current
      TZ: "Asia/Kolkata"

    steps:
      # -----------------------------------------
      # 1️⃣ Checkout Repository
      # -----------------------------------------
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref_name || 'feature/github-actions-poc-' }}
          token: ${{ secrets.GITHUB_TOKEN }}

      # -----------------------------------------
      # 2️⃣ Setup JDK
      # -----------------------------------------
      - name: ☕ Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # -----------------------------------------
      # 3️⃣ Clean Gradle Cache
      # -----------------------------------------
      - name: 🧹 Clean Gradle Cache
        run: |
          echo "🧹 Cleaning Gradle cache..."
          rm -rf ~/.gradle/caches/build-cache-* || true
          rm -rf ~/.gradle/daemon/* || true

      # -----------------------------------------
      # 4️⃣ Install Allure CLI (Non-sudo for self-hosted)
      # -----------------------------------------
      - name: 🧩 Install Allure CLI (Non-sudo)
        run: |
          echo "📦 Installing Allure CLI (non-sudo)..."
          mkdir -p /home/runner/work/allure-cli
          wget -q https://github.com/allure-framework/allure2/releases/download/2.27.0/allure-2.27.0.zip -O allure.zip
          unzip -q allure.zip -d /home/runner/work/allure-cli/
          chmod +x /home/runner/work/allure-cli/allure-2.27.0/bin/allure
          echo "/home/runner/work/allure-cli/allure-2.27.0/bin" >> $GITHUB_PATH
          /home/runner/work/allure-cli/allure-2.27.0/bin/allure --version

      # -----------------------------------------
      # 5️⃣ Run Tests and Generate Allure Report
      # -----------------------------------------
      - name: 🧪 Run Tests & Generate Allure Report
        run: |
          echo "🧪 Starting Test Execution..."
          if [ "${{ github.event.inputs.test_class }}" != "" ]; then
            echo "▶️ Running single test class: ${{ github.event.inputs.test_class }}"
            ./gradlew --no-daemon clean test --tests "${{ github.event.inputs.test_class }}" --info
          elif [ "${{ github.event.inputs.test_group }}" != "" ] && [ "${{ github.event.inputs.test_group }}" != "All" ]; then
            echo "▶️ Running specific group: ${{ github.event.inputs.test_group }}"
            ./gradlew --no-daemon clean test -Dgroups="${{ github.event.inputs.test_group }}" --info
          else
            echo "▶️ Running complete suite..."
            ./gradlew --no-daemon clean test --info
          fi

          echo "📊 Generating Safari-safe Allure report..."
          ./gradlew --no-daemon generateAllureReport --info

      # -----------------------------------------
      # 6️⃣ Verify Allure Results Existence
      # -----------------------------------------
      - name: 🕵️ Verify Allure Results Existence
        if: always()
        run: |
          echo "🔎 Checking Allure results directory..."
          if [ -d "build/allure-results" ]; then
            echo "✅ Allure results found:"
            find build/allure-results -name "*.json" | wc -l
          else
            echo "❌ No allure-results found!"
          fi

      # -----------------------------------------
      # 7️⃣ Upload Safari-safe Allure Report
      # -----------------------------------------
      - name: 📦 Upload Safari-safe Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Allure-Offline-Report-${{ github.run_number }}
          path: reports/current/Allure_Offline_Single_Safe.html
          retention-days: 10

      # -----------------------------------------
      # 8️⃣ Fail Build on Test Failure
      # -----------------------------------------
      - name: 🛑 Fail Build on Test Failure
        if: failure()
        run: |
          echo "❌ Tests failed! Marking build as failed."
          exit 1
