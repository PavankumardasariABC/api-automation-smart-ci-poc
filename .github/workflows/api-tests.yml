# 🚀 Smart API Automation CI Workflow
name: 🚀 API Automation CI

on:
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      branch:
        description: "Select branch to run tests"
        required: true
        default: "feature/github-actions-poc-"
      test_group:
        description: "Test group (Sanity, Integration, Regression, All)"
        required: true
        default: "All"
      test_class:
        description: "Optional: Run only specific API test class"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  api-tests:
    runs-on: self-hosted

    steps:
      # -----------------------------------------
      # 1️⃣ Checkout
      # -----------------------------------------
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref_name || 'feature/github-actions-poc-' }}
          token: ${{ secrets.GITHUB_TOKEN }}

      # -----------------------------------------
      # 2️⃣ Setup Java
      # -----------------------------------------
      - name: ☕ Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # -----------------------------------------
      # 3️⃣ Gradle Environment Setup (Optimized)
      # -----------------------------------------
      - name: 🧱 Prepare Gradle Environment
        run: |
          echo "Using self-hosted runner — skipping heavy Gradle cache restore"
          mkdir -p ~/.gradle/caches ~/.gradle/wrapper
          echo "✅ Gradle directories initialized."

      # -----------------------------------------
      # 4️⃣ Smart Test Selection
      # -----------------------------------------
      - name: 🧠 Smart Test Selection
        id: smart
        run: |
          echo "Detecting changed test files..."
          CHANGED=$(git diff --name-only origin/feature/github-actions-poc-...HEAD | grep 'src/test/java' || true)
          if [ -n "$CHANGED" ]; then
            echo "Changed test files detected — running Custom group"
            echo "group=Custom" >> $GITHUB_OUTPUT
          else
            echo "No specific changes; running group: ${{ github.event.inputs.test_group }}"
            echo "group=${{ github.event.inputs.test_group }}" >> $GITHUB_OUTPUT
          fi

      # -----------------------------------------
      # 5️⃣ Execute Tests
      # -----------------------------------------
      - name: 🧪 Run Tests
        run: |
          if [ "${{ github.event.inputs.test_class }}" != "" ]; then
            echo "🎯 Running specific test class: ${{ github.event.inputs.test_class }}"
            ./gradlew clean test --tests "${{ github.event.inputs.test_class }}" --info
          elif [ "${{ github.event.inputs.test_group }}" != "" ] && [ "${{ github.event.inputs.test_group }}" != "All" ]; then
            echo "🏷️ Running specific TestNG group: ${{ github.event.inputs.test_group }}"
            ./gradlew clean test -Dgroups=${{ github.event.inputs.test_group }} --info
          else
            echo "🧩 Running full regression suite..."
            ./gradlew clean test --info
          fi

      # -----------------------------------------
      # 6️⃣ Generate Allure Report
      # -----------------------------------------
      - name: 📊 Generate Allure Report
        run: |
          echo "⚙️ Generating Allure Report..."
          ./gradlew generateAllureReport
          echo "✅ Allure report available → reports/current/index.html"

      # -----------------------------------------
      # 7️⃣ Package as Single-File Offline HTML
      # -----------------------------------------
      - name: 🧩 Package Offline HTML Report
        run: |
          echo "📦 Creating single-file Allure HTML report..."
          ./gradlew packageAllureSingleHtml
          echo "✅ Offline report ready → reports/current/AllureReport_Offline.html"

      # -----------------------------------------
      # 8️⃣ Upload Single-File Report as Artifact
      # -----------------------------------------
      - name: 📦 Upload Offline Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Allure-Offline-HTML-${{ github.run_number }}
          path: reports/current/AllureReport_Offline.html
          retention-days: 15

      # -----------------------------------------
      # 9️⃣ Comment on PR with Download Link
      # -----------------------------------------
      - name: 💬 Comment Offline Report Link
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const message = `
            ✅ **Allure Report Generated (Offline Compatible)**
            📂 [Download Single HTML Report](${runUrl})

            💡 Once downloaded, open:
            \`AllureReport_Offline.html\`
            — opens instantly without any server or fetch() calls.
            `;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: message
            });

      # -----------------------------------------
      # 🔟 Fail Build on Test Failure
      # -----------------------------------------
      - name: 🛑 Fail Build on Test Failure
        if: failure()
        run: |
          echo "❌ Tests failed! Build will be marked as failed."
          exit 1
