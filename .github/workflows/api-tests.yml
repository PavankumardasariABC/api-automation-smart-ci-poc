# 🚀 Smart API Automation CI Workflow (Ultra Fast)
name: 🚀 API Automation CI

on:
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      branch:
        description: "Select branch to run tests"
        required: true
        default: "feature/github-actions-poc-"
      test_group:
        description: "Test group (Sanity, Integration, Regression, All)"
        required: true
        default: "All"
      test_class:
        description: "Optional: Run only specific API test class"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  api-tests:
    runs-on: self-hosted

    steps:
      # -----------------------------------------
      # 1️⃣ Checkout repository
      # -----------------------------------------
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref_name || 'feature/github-actions-poc-' }}
          token: ${{ secrets.GITHUB_TOKEN }}

      # -----------------------------------------
      # 2️⃣ Setup JDK
      # -----------------------------------------
      - name: ☕ Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: gradle   # ✅ Use built-in lightweight Gradle cache (not full 1 GB restore)

      # -----------------------------------------
      # 3️⃣ Quick Cache Cleanup (Optional)
      # -----------------------------------------
      - name: 🧹 Clean Gradle temp files (fast)
        run: |
          echo "🧹 Cleaning minimal Gradle leftovers..."
          rm -rf ~/.gradle/caches/build-cache-* || true
          rm -rf ~/.gradle/daemon/* || true
          echo "✅ Light cleanup complete."

      # -----------------------------------------
      # 4️⃣ Smart Test Selection
      # -----------------------------------------
      - name: 🧠 Smart Test Selection
        id: smart
        run: |
          echo "Detecting changed test files..."
          CHANGED=$(git diff --name-only origin/feature/github-actions-poc-...HEAD | grep 'src/test/java' || true)
          if [ -n "$CHANGED" ]; then
            echo "group=Custom" >> $GITHUB_OUTPUT
          else
            echo "group=${{ github.event.inputs.test_group }}" >> $GITHUB_OUTPUT
          fi

      # -----------------------------------------
      # 5️⃣ Run Tests
      # -----------------------------------------
      - name: 🧪 Run Tests
        run: |
          echo "Running tests for: ${{ github.event.inputs.test_class || 'All tests' }}"
          if [ "${{ github.event.inputs.test_class }}" != "" ]; then
            ./gradlew --no-daemon clean test --tests "${{ github.event.inputs.test_class }}" --info
          elif [ "${{ github.event.inputs.test_group }}" != "" ] && [ "${{ github.event.inputs.test_group }}" != "All" ]; then
            ./gradlew --no-daemon clean test -Dgroups="${{ github.event.inputs.test_group }}" --info
          else
            ./gradlew --no-daemon clean test --info
          fi

      # -----------------------------------------
      # 6️⃣ Generate Allure Report
      # -----------------------------------------
      - name: 📊 Generate Offline Allure Report
        run: |
          echo "⚙️ Generating offline Allure report..."
          ./gradlew --no-daemon generateAllureReport
          echo "✅ Allure report ready → reports/current/index.html"

      # -----------------------------------------
      # 7️⃣ Zip Self-Contained HTML Report
      # -----------------------------------------
      - name: 🗜️ Zip Allure HTML
        if: always()
        run: |
          cd reports/current
          zip -r ../../Allure-Offline-Report.zip .
          cd ../..
          echo "✅ Allure offline report zipped."

      # -----------------------------------------
      # 8️⃣ Upload Report Artifact
      # -----------------------------------------
      - name: 📦 Upload Offline Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Allure-Offline-Report-${{ github.run_number }}
          path: Allure-Offline-Report.zip
          retention-days: 10

      # -----------------------------------------
      # 🔟 Fail Build on Test Failure
      # -----------------------------------------
      - name: 🛑 Fail Build on Test Failure
        if: failure()
        run: |
          echo "❌ Tests failed! Build will be marked as failed."
          exit 1
