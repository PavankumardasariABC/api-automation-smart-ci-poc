name: 🚀 API Automation CI

on:
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      branch:
        description: "Select branch to run tests"
        required: true
        default: "feature/github-actions-poc-"
      test_group:
        description: "Test group (Sanity, Integration, Regression, All)"
        required: true
        default: "All"
      test_class:
        description: "Optional: Run only specific API test class"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  api-tests:
    runs-on: self-hosted
    env:
      TZ: "Asia/Kolkata"
      ALLURE_RESULTS_DIR: build/allure-results
      ALLURE_REPORT_DIR: reports/current
      AUTH_USERNAME: ${{ secrets.AUTH_USERNAME }}
      AUTH_PASSWORD: ${{ secrets.AUTH_PASSWORD }}

    steps:
      # -----------------------------------------
      # 1️⃣ Checkout Repository
      # -----------------------------------------
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      # -----------------------------------------
      # 2️⃣ Cache Gradle dependencies
      # -----------------------------------------
      - name: ⚡ Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # -----------------------------------------
      # 3️⃣ Setup JDK
      # -----------------------------------------
      - name: ☕ Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # -----------------------------------------
      # 4️⃣ Install Allure CLI (if not present)
      # -----------------------------------------
      - name: 🧩 Install Allure CLI (cached)
        run: |
          BASE_DIR="${{ github.workspace }}/allure-cli"
          if [ ! -d "$BASE_DIR/allure-2.27.0" ]; then
            echo "⬇️ Installing Allure CLI..."
            mkdir -p "$BASE_DIR"
            curl -L -o "$BASE_DIR/allure.zip" https://github.com/allure-framework/allure2/releases/download/2.27.0/allure-2.27.0.zip
            unzip -q "$BASE_DIR/allure.zip" -d "$BASE_DIR"
            chmod +x "$BASE_DIR/allure-2.27.0/bin/allure"
          else
            echo "✅ Allure CLI already cached"
          fi
          echo "$BASE_DIR/allure-2.27.0/bin" >> $GITHUB_PATH
          allure --version

      # -----------------------------------------
      # 5️⃣ Smart Test Selection
      # -----------------------------------------
      - name: 🧠 Smart Test Selection
        id: smart
        run: |
          echo "Detecting changed test files..."
          CHANGED=$(git diff --name-only origin/feature/github-actions-poc-...HEAD | grep 'src/test/java' || true)
          if [ -n "$CHANGED" ]; then
            echo "Changed test files:"
            echo "$CHANGED"
            echo "group=Custom" >> $GITHUB_OUTPUT
          else
            echo "No specific changes; running default group."
            echo "group=${{ github.event.inputs.test_group }}" >> $GITHUB_OUTPUT
          fi

      # -----------------------------------------
      # 6️⃣ Run Tests
      # -----------------------------------------
      - name: 🧪 Run Tests
        run: |
          echo "🧪 Starting Test Execution..."
          if [ "${{ github.event.inputs.test_class }}" != "" ]; then
            echo "🎯 Running specific test class: ${{ github.event.inputs.test_class }}"
            ./gradlew clean test --tests "${{ github.event.inputs.test_class }}" --info
          elif [ "${{ github.event.inputs.test_group }}" != "" ] && [ "${{ github.event.inputs.test_group }}" != "All" ]; then
            echo "🏷️ Running specific TestNG group: ${{ github.event.inputs.test_group }}"
            ./gradlew clean test -Dgroups=${{ github.event.inputs.test_group }} --info
          else
            echo "🧩 Running full regression suite..."
            ./gradlew clean test --info
          fi

      # -----------------------------------------
      # 7️⃣ Generate Allure Report
      # -----------------------------------------
      - name: 📊 Generate Allure Report
        run: ./gradlew generateAllureReport --info

      # -----------------------------------------
      # 8️⃣ Verify Allure Results
      # -----------------------------------------
      - name: 🕵️ Verify Allure Results
        if: always()
        run: |
          if [ -d "build/allure-results" ]; then
            echo "✅ Found allure-results:"
            find build/allure-results -name "*.json" | wc -l
          else
            echo "❌ No allure-results found!"
          fi

      # -----------------------------------------
      # 9️⃣ Upload Report Artifact
      # -----------------------------------------
      - name: 📦 Upload Allure Report Folder
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Allure-Full-Report-${{ github.run_number }}
          path: reports/current/
          retention-days: 10

      # -----------------------------------------
      # 🔟 Publish to GitHub Pages
      # -----------------------------------------
      - name: 🌐 Publish Allure Report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: reports/current
          destination_dir: reports/latest
          keep_files: true
          commit_message: "📊 Publish Allure Report #${{ github.run_number }}"

      # -----------------------------------------
      # 11️⃣ Comment on PR
      # -----------------------------------------
      - name: 💬 Comment on PR
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = context.issue.number;
            const message = `
            ✅ API tests executed for this PR
            - **Branch:** ${{ github.ref_name }}
            - **Group:** ${{ github.event.inputs.test_group || 'All' }}
            - 📊 [View Allure Report (Live)](https://pavankumardasariabc.github.io/api-automation-smart-ci-poc/reports/latest/)
            - 💾 Artifact: Allure-Full-Report-${{ github.run_number }}
            `;
            await github.rest.issues.createComment({
              issue_number: prNumber,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: message
            });

      # -----------------------------------------
      # 12️⃣ Fail Build on Test Failure
      # -----------------------------------------
      - name: 🛑 Fail Build on Test Failure
        if: failure()
        run: exit 1
