name: "🚀 API Automation CI"

on:
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      branch:
        description: "Select branch to run tests"
        required: true
        default: "feature/github-actions-poc-"
      test_group:
        description: "Test group (Sanity, Integration, Regression, All)"
        required: true
        default: "All"
      test_class:
        description: "Optional: Run only specific API test class"
        required: false
        default: ""

permissions:
  contents: write  # needed for gh-pages push

concurrency:
  group: api-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-tests:
    runs-on: self-hosted
    env:
      TZ: "Asia/Kolkata"
      ALLURE_RESULTS_DIR: build/allure-results           # Gradle default
      ALLURE_REPORT_DIR: build/reports/allure-report     # Gradle default report
      PUBLISH_DIR: reports/site                          # Folder we publish/upload
      AUTH_USERNAME: ${{ secrets.AUTH_USERNAME }}
      AUTH_PASSWORD: ${{ secrets.AUTH_PASSWORD }}

    steps:
      # 1) Checkout
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref_name }}
          fetch-depth: 0

      # 2) JDK + Gradle (with smart caching)
      - name: ☕ Setup JDK + Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper
          cache-read-only: false
          cache-cleanup: true

      # 3) Allure CLI (used by your project / optional if Gradle task is enough)
      - name: 🧩 Install Allure CLI (cached)
        shell: bash
        run: |
          set -e
          BASE_DIR="${{ github.workspace }}/allure-cli"
          if [ ! -d "$BASE_DIR/allure-2.27.0" ]; then
            echo "⬇️ Installing Allure CLI..."
            mkdir -p "$BASE_DIR"
            curl -L -o "$BASE_DIR/allure.zip" https://github.com/allure-framework/allure2/releases/download/2.27.0/allure-2.27.0.zip
            unzip -q "$BASE_DIR/allure.zip" -d "$BASE_DIR"
            chmod +x "$BASE_DIR/allure-2.27.0/bin/allure"
          else
            echo "✅ Allure CLI already cached"
          fi
          echo "$BASE_DIR/allure-2.27.0/bin" >> $GITHUB_PATH
          allure --version

      # 4) Smart test selection (diff vs main)
      - name: 🧠 Smart Test Selection
        id: smart
        shell: bash
        run: |
          set -e
          git fetch origin
          echo "Detecting changed test files..."
          CHANGED=$(git diff --name-only origin/main...HEAD | grep 'src/test/java' || true)
          if [ -n "$CHANGED" ]; then
            echo "Changed test files:"
            echo "$CHANGED"
            echo "group=Custom" >> $GITHUB_OUTPUT
          else
            echo "No specific changes; using input group."
            echo "group=${{ github.event.inputs.test_group }}" >> $GITHUB_OUTPUT
          fi

      # 5) Run tests
      - name: 🧪 Run Tests
        shell: bash
        run: |
          set -e
          echo "🧪 Starting Test Execution..."
          if [ -n "${{ github.event.inputs.test_class }}" ]; then
            echo "🎯 Class: ${{ github.event.inputs.test_class }}"
            ./gradlew test --parallel --max-workers=4 --tests "${{ github.event.inputs.test_class }}" --info
          elif [ -n "${{ github.event.inputs.test_group }}" ] && [ "${{ github.event.inputs.test_group }}" != "All" ]; then
            echo "🏷️ Group: ${{ github.event.inputs.test_group }}"
            ./gradlew test --parallel --max-workers=4 -Dgroups=${{ github.event.inputs.test_group }} --info
          else
            echo "🧩 Full regression"
            ./gradlew test --parallel --max-workers=4 --info
          fi
          echo "✅ Tests finished."

      # 6) Generate Allure report (Gradle default location)
      - name: 📊 Generate Allure Report
        if: always()
        shell: bash
        run: |
          set -e
          if [ -d "${ALLURE_RESULTS_DIR}" ] && [ "$(find "${ALLURE_RESULTS_DIR}" -name '*.json' | wc -l)" -gt 0 ]; then
            echo "⚙️ Generating Allure report via Gradle…"
            ./gradlew generateAllureReport --info
          else
            echo "⚠️ No allure-results found — skipping report generation."
          fi

      # 7) Prepare publish folder (copy generated site, add .nojekyll & helpers)
      - name: 🧰 Prepare site for upload & Pages
        if: always()
        shell: bash
        run: |
          set -e
          mkdir -p "${PUBLISH_DIR}"
          if [ -d "${ALLURE_REPORT_DIR}" ]; then
            rsync -a --delete "${ALLURE_REPORT_DIR}/" "${PUBLISH_DIR}/"
            echo "✅ Copied site to ${PUBLISH_DIR}"
          else
            echo "❌ ${ALLURE_REPORT_DIR} not found; nothing to publish."
          fi

          # Prevent GitHub Pages/Jekyll from stripping assets
          touch "${PUBLISH_DIR}/.nojekyll"

          # Local-view helpers
          cat > "${PUBLISH_DIR}/README_OPEN_ME.txt" <<'TXT'
          How to open this Allure report locally
          =====================================
          Option A (Mac/Linux):
            1) Open terminal in this folder
            2) python3 -m http.server 8000
            3) Open http://localhost:8000

          Option B (Windows PowerShell):
            1) cd to this folder
            2) python -m http.server 8000
            3) Start-Process http://localhost:8000

          Note: Opening index.html with file:// may show "Loading..." due to browser security.
          TXT

          cat > "${PUBLISH_DIR}/run_local_server.sh" <<'SH'
          #!/usr/bin/env bash
          PORT=${1:-8000}
          echo "Starting local server on http://localhost:${PORT}"
          python3 -m http.server "${PORT}"
          SH
          chmod +x "${PUBLISH_DIR}/run_local_server.sh"

          cat > "${PUBLISH_DIR}/run_local_server.bat" <<'BAT'
          @echo off
          set PORT=%1
          if "%PORT%"=="" set PORT=8000
          echo Starting local server on http://localhost:%PORT%
          python -m http.server %PORT%
          BAT

          # Quick sanity checks
          if [ -f "${PUBLISH_DIR}/index.html" ]; then
            echo "🔎 Found index.html in ${PUBLISH_DIR}"
          else
            echo "⚠️ index.html missing in ${PUBLISH_DIR}"
          fi
          echo "📦 Files in site:"
          ls -l "${PUBLISH_DIR}" | head -50

      # 8) Upload artifact (full site)
      - name: 📦 Upload Full Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Allure-Full-Report-${{ github.run_number }}
          path: ${{ env.PUBLISH_DIR }}/
          retention-days: 15

      # 9) Publish to GitHub Pages (latest + per-run)
      - name: 🌐 Publish Allure report (latest)
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ${{ env.PUBLISH_DIR }}
          publish_branch: gh-pages
          destination_dir: reports/latest
          keep_files: true
          commit_message: "📊 Publish Allure Report (latest) #${{ github.run_number }}"

      - name: 🌐 Publish Allure report (per-run)
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ${{ env.PUBLISH_DIR }}
          publish_branch: gh-pages
          destination_dir: reports/runs/${{ github.run_number }}
          keep_files: true
          commit_message: "📊 Publish Allure Report (run ${{ github.run_number }})"

      # 10) Comment PR with live links
      - name: 💬 Comment on PR
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const pagesBase = `https://${context.repo.owner}.github.io/${context.repo.repo}`;
            const msg = `
            ✅ **API tests completed**
            • **Branch:** \`${{ github.ref_name }}\`
            • **Suite:** \`${{ github.event.inputs.test_group || 'All' }}\`

            📊 **Live Allure report**
            • Latest: ${pagesBase}/reports/latest/
            • This run: ${pagesBase}/reports/runs/${{ github.run_number }}/

            💾 **Artifacts**
            • Full folder: [Download here](${runUrl}) → **Allure-Full-Report-${{ github.run_number }}**
            • To view locally: unzip → run \`run_local_server.sh\` (Mac/Linux) or \`run_local_server.bat\` (Windows) → open http://localhost:8000
            `;
            await github.rest.issues.createComment({ ...context.issue, body: msg });

      # 11) Fail job if tests failed (reports remain published)
      - name: 🛑 Fail Build on Test Failure
        if: failure()
        run: exit 1
