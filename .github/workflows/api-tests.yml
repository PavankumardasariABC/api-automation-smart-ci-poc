# 🚀 Smart API Automation CI Workflow
name: 🚀 API Automation CI

on:
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      branch:
        description: "Select branch to run tests"
        required: true
        default: "feature/github-actions-poc-"
      test_group:
        description: "Test group (Sanity, Integration, Regression, All)"
        required: true
        default: "All"
      test_class:
        description: "Optional: Run only specific API test class"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  api-tests:
    runs-on: self-hosted

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref_name || 'feature/github-actions-poc-' }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: ☕ Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 🧹 Trim Gradle cache (avoid 1 GB downloads)
        run: |
          mkdir -p ~/.gradle/caches
          rm -rf ~/.gradle/caches/*/fileHashes
          rm -rf ~/.gradle/caches/*/scripts
          rm -rf ~/.gradle/caches/*/scripts-remapped
          echo "✅ Cleaned transient Gradle cache directories"

      # Optional cache step – can comment out if slow
      - name: 🧱 Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 🧠 Smart Test Selection
        id: smart
        run: |
          echo "Detecting changed test files..."
          CHANGED=$(git diff --name-only origin/feature/github-actions-poc-...HEAD | grep 'src/test/java' || true)
          if [ -n "$CHANGED" ]; then
            echo "group=Custom" >> $GITHUB_OUTPUT
          else
            echo "group=${{ github.event.inputs.test_group }}" >> $GITHUB_OUTPUT
          fi

      - name: 🧪 Run Tests
        run: |
          if [ "${{ github.event.inputs.test_class }}" != "" ]; then
            ./gradlew clean test --tests "${{ github.event.inputs.test_class }}" --info
          elif [ "${{ github.event.inputs.test_group }}" != "" ] && [ "${{ github.event.inputs.test_group }}" != "All" ]; then
            ./gradlew clean test -Dgroups="${{ github.event.inputs.test_group }}" --info
          else
            ./gradlew clean test --info
          fi

      - name: 📊 Generate Allure Report
        run: |
          ./gradlew generateAllureReport
          echo "✅ Allure report generated → reports/current/index.html"

      - name: 📦 Upload Allure Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Allure-HTML-Report-${{ github.run_number }}
          path: reports/current/
          retention-days: 15

      - name: 🌐 Serve Allure Report for demo
        if: always()
        run: |
          cd reports/current
          python3 -m http.server 8080 &
          echo "🌍 Access locally at → http://localhost:8080"

      - name: 🛑 Fail Build on Test Failure
        if: failure()
        run: |
          echo "❌ Tests failed!"
          exit 1
