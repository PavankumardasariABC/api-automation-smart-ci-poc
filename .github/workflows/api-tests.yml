name: "🚀 API Automation CI"

on:
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      branch:
        description: "Select branch to run tests"
        required: true
        default: "feature/github-actions-poc-"
      test_group:
        description: "Test group (Sanity, Integration, Regression, All)"
        required: true
        default: "All"
      test_class:
        description: "Optional: Run only specific API test class"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: api-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-tests:
    runs-on: self-hosted
    env:
      TZ: "Asia/Kolkata"
      ALLURE_RESULTS_DIR: build/allure-results
      ALLURE_REPORT_DIR: reports/current
      AUTH_USERNAME: ${{ secrets.AUTH_USERNAME }}
      AUTH_PASSWORD: ${{ secrets.AUTH_PASSWORD }}

    steps:
      # 1️⃣ Checkout Code
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref_name }}
          fetch-depth: 0

      # 2️⃣ Setup JDK + Optimized Gradle Cache (faster builds)
      - name: ☕ Setup JDK + Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper
          cache-read-only: false
          cache-cleanup: true

      # 3️⃣ Setup Allure CLI (cached)
      - name: 🧩 Install Allure CLI (cached)
        run: |
          BASE_DIR="${{ github.workspace }}/allure-cli"
          if [ ! -d "$BASE_DIR/allure-2.27.0" ]; then
            echo "⬇️ Installing Allure CLI..."
            mkdir -p "$BASE_DIR"
            curl -L -o "$BASE_DIR/allure.zip" https://github.com/allure-framework/allure2/releases/download/2.27.0/allure-2.27.0.zip
            unzip -q "$BASE_DIR/allure.zip" -d "$BASE_DIR"
            chmod +x "$BASE_DIR/allure-2.27.0/bin/allure"
          else
            echo "✅ Allure CLI already cached"
          fi
          echo "$BASE_DIR/allure-2.27.0/bin" >> $GITHUB_PATH
          allure --version

      # 4️⃣ Smart Test Selection (diff vs main)
      - name: 🧠 Smart Test Selection
        id: smart
        shell: bash
        run: |
          git fetch origin
          echo "Detecting changed test files..."
          CHANGED=$(git diff --name-only origin/main...HEAD | grep 'src/test/java' || true)
          if [ -n "$CHANGED" ]; then
            echo "Changed test files:"
            echo "$CHANGED"
            echo "group=Custom" >> $GITHUB_OUTPUT
          else
            echo "No specific changes; using input group."
            echo "group=${{ github.event.inputs.test_group }}" >> $GITHUB_OUTPUT
          fi

      # 5️⃣ Run Tests
      - name: 🧪 Run Tests
        shell: bash
        run: |
          echo "🧪 Starting Test Execution..."
          if [ -n "${{ github.event.inputs.test_class }}" ]; then
            echo "🎯 Running Class: ${{ github.event.inputs.test_class }}"
            ./gradlew test --parallel --max-workers=4 --tests "${{ github.event.inputs.test_class }}" --info
          elif [ -n "${{ github.event.inputs.test_group }}" ] && [ "${{ github.event.inputs.test_group }}" != "All" ]; then
            echo "🏷️ Running Group: ${{ github.event.inputs.test_group }}"
            ./gradlew test --parallel --max-workers=4 -Dgroups=${{ github.event.inputs.test_group }} --info
          else
            echo "🧩 Running Full Regression Suite"
            ./gradlew test --parallel --max-workers=4 --info
          fi

      # 6️⃣ Generate Allure Report (Full Sync + Trends)
      - name: 📊 Generate Allure Report (Full Sync)
        if: always()
        run: |
          echo "🧩 Syncing Allure results..."
          mkdir -p reports/current
          cp -R build/allure-results/* reports/current/ || true

          echo "⚙️ Generating Allure report..."
          ./gradlew cleanTest generateAllureReport --info

          if [ -d "reports/history" ]; then
            echo "📈 Preserving historical trend data..."
            cp -R reports/history reports/current/ || true
          fi

          echo "✅ Report generated successfully at reports/current/index.html"

      # 7️⃣ Add Local-View Scripts for Offline Access
      - name: 🧰 Add local-view helper scripts
        if: always()
        shell: bash
        run: |
          REPORT_DIR="reports/current"
          [ -d "$REPORT_DIR" ] || exit 0

          cat > "$REPORT_DIR/README_OPEN_ME.txt" <<'TXT'
          How to open this Allure report locally
          =====================================
          Option A (Mac/Linux):
            python3 -m http.server 8000
            Open http://localhost:8000

          Option B (Windows PowerShell):
            python -m http.server 8000
            Start-Process http://localhost:8000
          TXT

          cat > "$REPORT_DIR/run_local_server.sh" <<'SH'
          #!/usr/bin/env bash
          PORT=${1:-8000}
          echo "Starting local server on http://localhost:${PORT}"
          python3 -m http.server "${PORT}"
          SH
          chmod +x "$REPORT_DIR/run_local_server.sh"

          cat > "$REPORT_DIR/run_local_server.bat" <<'BAT'
          @echo off
          set PORT=%1
          if "%PORT%"=="" set PORT=8000
          echo Starting local server on http://localhost:%PORT%
          python -m http.server %PORT%
          BAT

      # 8️⃣ Upload Artifacts
      - name: 📦 Upload Full Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Allure-Full-Report-${{ github.run_number }}
          path: reports/current/
          retention-days: 15

      # 9️⃣ Publish to GitHub Pages (Live Reports)
      - name: 🌐 Publish Allure report (latest)
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: reports/current
          destination_dir: reports/latest
          keep_files: true
          commit_message: "📊 Publish Allure Report (latest) #${{ github.run_number }}"

      - name: 🌐 Publish Allure report (per-run)
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: reports/current
          destination_dir: reports/runs/${{ github.run_number }}
          keep_files: true
          commit_message: "📊 Publish Allure Report (run ${{ github.run_number }})"

      # 🔟 Comment PR with Live Report Links
      - name: 💬 Comment on PR
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const pagesBase = `https://${context.repo.owner}.github.io/${context.repo.repo}`;
            const msg = `
            ✅ **API Tests Completed**
            • **Branch:** \`${{ github.ref_name }}\`
            • **Suite:** \`${{ github.event.inputs.test_group || 'All' }}\`

            📊 **Allure Reports**
            • Latest: ${pagesBase}/reports/latest/
            • This run: ${pagesBase}/reports/runs/${{ github.run_number }}/

            💾 **Artifacts**
            • [Download Folder](${runUrl}) → Allure-Full-Report-${{ github.run_number }}
            • To open locally: run \`run_local_server.sh\` or \`run_local_server.bat\`
            `;
            await github.rest.issues.createComment({ ...context.issue, body: msg });

      # 1️⃣1️⃣ Fail Job on Test Failure (but keep reports)
      - name: 🛑 Fail Build on Test Failure
        if: failure()
        run: exit 1
