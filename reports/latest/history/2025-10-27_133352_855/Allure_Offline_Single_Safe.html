<script>
(function(){
  const el = document.getElementById('embedded-json');
  if(!el){console.error('❌ Embedded JSON not found');return;}
  const data = JSON.parse(el.textContent);
  const origFetch = window.fetch;
  window.fetch = (url)=>{
    if(url && (url.includes('/data/') || url.includes('/widgets/'))){
      const file=url.split('/').pop();
      const b64=data[file];
      if(b64){
        const decoded = new TextDecoder('utf-8').decode(
            Uint8Array.from(atob(b64), c => c.charCodeAt(0))
        );
        return Promise.resolve({
          ok:true,status:200,
          json:async()=>JSON.parse(decoded),
          text:async()=>decoded
        });
      }
    }
    return origFetch(url);
  };
  if('serviceWorker' in navigator){
    navigator.serviceWorker.getRegistrations().then(r=>r.forEach(s=>s.unregister()));
  }
  console.log('✅ Allure Offline Mode Activated');
})();
</script>
