# Use this workflow when order-session-api-automation is the **Git repo root** (standalone copy).
# In the monorepo, prefer the root file: ../../.github/workflows/order-session-api-tests.yml

name: Order Session API tests (standalone)

on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [dev, qa, stage, beta]
        default: qa
      test_group:
        type: choice
        options: [Smoke, Sanity, Regression, All]
        default: Smoke
      test_class:
        required: false
        default: ""

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      ORDER_SESSION_JWT: ${{ secrets.ORDER_SESSION_JWT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Gradle test
        run: |
          chmod +x ./gradlew
          ENV="${{ github.event.inputs.environment }}"
          GROUP="${{ github.event.inputs.test_group }}"
          CLASS="${{ github.event.inputs.test_class }}"
          ARGS=(test --no-daemon -Denv="$ENV")
          if [ -n "$CLASS" ]; then ARGS+=(-DtestClass="$CLASS")
          elif [ "$GROUP" != "All" ]; then ARGS+=(-Dgroups="$GROUP")
          fi
          ./gradlew "${ARGS[@]}"
