# Order Session — QA defaults (no secrets). Team overrides: qa.local.properties (see qa.local.properties.example)
# Guide: docs/TEAM_CONFIGURATION.md and env/README.md
#
# --- Order Session API (this module) ---
order.session.base.url=https://api-qa.commerce.abc.fitness/api/order-session

# Tenant for ABCFS-ORGANIZATION-ID — set ONLY here or in qa.local.properties (do not edit tests/JSON).
# Use either key (primary wins if both are set): abcfs.organization.id | organization.id
abcfs.organization.id=REPLACE_ORGANIZATION_UUID
# organization.id=

# OAuth: copy config/oauth-env.local.properties.example → config/oauth-env.local.properties (gitignored), or set ORDER_SESSION_JWT / auth.bearer.token
order.session.auth.source=GLOFOX
auth.bearer.token=__FETCH_FROM_EXTERNAL__
external.api.env.path=config/oauth-env.local.properties

# Optional: override Glofox client id/secret (defaults GLOFOX_AUTH:GLOFOX_AUTH)
# glofox.auth.client.id=
# glofox.auth.client.secret=

# Integration IDs (Order Session consumer, location, wallet owner — leave blank to skip E2E creates)
test.consumer.id=
test.location.id=
test.owner.id=
test.wallet.user.id=
test.wallet.user.external.id=
test.consumer.origin=https://dc01dapigateway.abcfinancial.net:8080
